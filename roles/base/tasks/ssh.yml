---
- name: Ensure ~/.ssh directory exists with secure permissions
  ansible.builtin.file:
    path: "~/.ssh"
    state: directory
    mode: "0700"

- name: Copy ssh config
  ansible.builtin.copy:
    src: "files/config/ssh/config"
    dest: "~/.ssh/config"
    mode: "0600"
    backup: true

- name: Check if SSH private key exists
  ansible.builtin.stat:
    path: "~/.ssh/id_ed25519"
  register: ssh_key_stat

- name: Prompt for SSH key passphrase
  ansible.builtin.pause:
    prompt: "Enter passphrase for new SSH key (leave blank for no passphrase)"
    echo: false
  register: ssh_key_passphrase
  when: not ssh_key_stat.stat.exists

- name: Generate Ed25519 SSH key pair
  ansible.builtin.command: >
    ssh-keygen -q -t ed25519 -C "{{ ansible_facts['user_id'] }}@{{ ansible_facts['nodename'] }}" -f ~/.ssh/id_ed25519 -N "{{ ssh_key_passphrase.user_input | default('') }}"
  when: not ssh_key_stat.stat.exists
  no_log: true

- name: Ensure SSH private key permissions
  ansible.builtin.file:
    path: "~/.ssh/id_ed25519"
    mode: "0600"

- name: Ensure SSH public key permissions
  ansible.builtin.file:
    path: "~/.ssh/id_ed25519.pub"
    mode: "0644"
