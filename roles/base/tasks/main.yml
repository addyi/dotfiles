---
- name: Set up Git configuration
  ansible.builtin.include_tasks: git.yml

- name: Set up zshrc and oh-my-zsh
  ansible.builtin.include_tasks: zsh.yml

- name: Set up SSH configuration and keys
  ansible.builtin.include_tasks: ssh.yml

- name: Set up tmux and TPM
  ansible.builtin.include_tasks: tmux.yml

- name: Set up Neovim configuration
  ansible.builtin.include_tasks: nvim.yml

- name: Set up Ghostty configuration
  ansible.builtin.include_tasks: ghostty.yml

- name: Set up Micro configuration
  ansible.builtin.include_tasks: micro.yml

- name: Set up "~/dev" directory
  ansible.builtin.include_tasks: dev-directory.yml
