---
- name: Update apt cache and install packages
  ansible.builtin.apt:
    name: "{{ linux_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "~/.local/bin"
    state: directory

- name: Create compatibility symlinks for renamed binaries
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ linux_symlinks | default([]) }}"
  when: linux_symlinks is defined
